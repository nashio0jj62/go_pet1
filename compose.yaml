name: payway

x-backend-env: &backend-env
  DATABASE_URL: "postgres://payway:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/payway?sslmode=disable"
  KAFKA_BROKERS: kafka:9092
  KAFKA_EVENTS_TOPIC: payment.events
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

x-app: &app
  build: .
  environment: &app-env
    <<: *backend-env
    KAFKA_COMMANDS_TOPIC: payment.commands
    PROVIDER_URL: http://mock-psp:8081
    CALLBACK_URL: http://api:8080/callbacks/mock
    CALLBACK_SECRET: "${CALLBACK_SECRET:?Set CALLBACK_SECRET in .env}"
  depends_on:
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully
    otel-collector:
      condition: service_started
  restart: on-failure
  stop_grace_period: 30s

services:
  api:
    <<: *app
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    <<: *app
    entrypoint: ["/app/worker"]

  projection:
    <<: *app
    environment: *backend-env
    entrypoint: ["/app/projection"]

  mock-psp:
    build: .
    entrypoint: ["/app/mock-psp"]
    environment:
      <<: *app-env
      HTTP_ADDR: :8081
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: on-failure
    stop_grace_period: 30s

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/002_processing.sql:/migrations/002_processing.sql:ro
      - ./migrations/003_tracing.sql:/migrations/003_tracing.sql:ro
      - ./migrations/004_command_idempotency.sql:/migrations/004_command_idempotency.sql:ro
    entrypoint: ["psql"]
    command:
      - -h
      - postgres
      - -U
      - payway
      - -d
      - payway
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /migrations/002_processing.sql
      - -f
      - /migrations/003_tracing.sql
      - -f
      - /migrations/004_command_idempotency.sql
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    restart: on-failure

  jaeger:
    image: jaegertracing/jaeger:2.4.0
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    depends_on:
      otel-collector:
        condition: service_started

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payway.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payway
      POSTGRES_USER: payway
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U payway -d payway"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.commands --partitions 3 --replication-factor 1 --config retention.ms=-1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.events --partitions 3 --replication-factor 1 --config retention.ms=-1

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:

